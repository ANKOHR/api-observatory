[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-observatory"
version = "0.1.0"
description = "Deterministic local fixture API drift monitor"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
obs = "api_observatory.cli:main"

[tool.setuptools.packages.find]
include = ["api_observatory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
